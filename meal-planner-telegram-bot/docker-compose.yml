# =============================================================================
# Meal Planner Telegram Bot - Docker Compose Configuration
# =============================================================================
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml up -d
#   Logs:        docker-compose logs -f meal-planner-bot
#   Stop:        docker-compose down
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Meal Planner Bot Service
  # ---------------------------------------------------------------------------
  meal-planner-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: meal-planner-bot
    restart: unless-stopped
    
    # Environment variables (loaded from .env file)
    env_file:
      - .env
    
    # Mount volumes for persistence
    volumes:
      # SQLite database persistence - bind mount for easy access
      - ./data:/app/data
      # Optional: mount for development (uncomment for live reload)
      # - ./src:/app/src:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# -----------------------------------------------------------------------------
# Networks (optional, for multi-service setups)
# -----------------------------------------------------------------------------
networks:
  default:
    name: meal-planner-network